name: 'Terraform'

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  issues: write
  contents: read

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup AWS CLI
      uses: unfor19/install-aws-cli-action@v1
      with:
        version: 2                         # default
        verbose: false                     # default
        arch: amd64                        # allowed values: amd64, x86, x64, arm, arm64

    - name: Setup Prowler
      run: |
        sudo apt update
        sudo apt install pipx
        pipx ensurepath
        pipx install prowler
        prowler -v

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.1.0
      with:
        role-to-assume: arn:aws:iam::162105037857:role/TerraformExecutor
        aws-region: eu-west-1
    # Install the latest version of Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.14.7

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false

    - name: Run Prowler IaC Scan (Terraform)
      run: |
       prowler iac --scan-path . \
       --output json \
       --output-file prowler-iac-results.json
      
    - name: Create GitHub Issues from Prowler IaC Findings
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');

          const results = JSON.parse(fs.readFileSync('prowler-iac-results.json', 'utf8'));

          for (const finding of results) {
            if (finding.Status === "FAIL") {
              const title = `[Prowler IaC] ${finding.CheckID}: ${finding.CheckTitle}`;

              const body = `
              **Severity:** ${finding.Severity}
              **Resource:** ${finding.ResourceId}
              **File:** ${finding.File || "N/A"}

              **Description:**
              ${finding.Description}

              **Remediation:**
              ${finding.Remediation || "See Prowler documentation"}
              `;

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body
              });
            }
          }

    - name: Terraform Apply
      # if: github.ref == 'refs/heads/"main"' && github.event_name == 'push'
      run: terraform apply -auto-approve -input=false

    - name: Prowler AWS Check
      run: prowler aws --services s3 rds ec2 vpc rds secretsmanager iam ssm --security-hub --region eu-west-1 -z --send-sh-only-fails